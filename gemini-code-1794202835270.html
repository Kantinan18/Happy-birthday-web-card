<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Birthday Cake - Click to Blow</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color:#eb8aff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* --------------------------------------------------
       1. ตัวเค้กและชั้นต่างๆ ลอยลงมาจากด้านบน
    -------------------------------------------------- */
    .cake {
      position: relative;
      width: 250px;
      height: 110px;
      margin-bottom: -5px;
      z-index: 2;
    }

    .layer {
      position: absolute;
      width: 100%;
      height: 35px;
      background-color: #a06e5d;
      border-radius: 8px;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
      animation: dropIn 0.5s ease-out forwards;
      opacity: 0;
    }

    .layer-bottom { bottom: 0; animation-delay: 0.2s; }
    .layer-middle { bottom: 30px; animation-delay: 0.6s; }
    .layer-top    { bottom: 60px; animation-delay: 1.0s; }

    @keyframes dropIn {
      0% {
        transform: translateY(-300px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* ครีมสีขาวด้านบน */
    .icing-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 55px;
      z-index: 3;
      animation: dropIn 0.5s 1.4s ease-out forwards;
      opacity: 0;
    }

    .icing-svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
    }

    /* --------------------------------------------------
       2. เทียน เปลวไฟเปิด-ปิดได้ และควัน
    -------------------------------------------------- */
    .candle {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 38px;
      background-color: #ffffff;
      border-radius: 3px;
      z-index: 4;
      cursor: pointer;
      animation: dropIn 0.5s 1.8s ease-out forwards;
      opacity: 0;
    }

    .candle::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 6px;
      background-color: #555;
    }

    .flame {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 18px;
      background-color: #ffd700;
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 12px #ffdb4d, 0 0 25px #ff9900;
      animation: flicker 0.6s infinite alternate ease-in-out, fadeIn 0.4s 2.3s forwards;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
    }

    .smoke {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    /* สถานะเป่าดับ */
    .candle.blown-out .flame {
      display: none !important;
    }

    .candle.blown-out .smoke {
      animation: riseSmoke 1.5s ease-out forwards;
    }

    @keyframes riseSmoke {
      0% { opacity: 0.9; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -35px) scale(3.5); }
    }

    /* จานรอง */
    .plate {
      width: 300px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      z-index: 1;
    }

    /* --------------------------------------------------
       3. ข้อความอวยพร
    -------------------------------------------------- */
    .text-container {
      margin-top: 35px;
      color: #ffffff;
      animation: fadeIn 0.8s 2.6s ease forwards;
      opacity: 0;
    }

    .text-container h1 { font-size: 2.2rem; font-style: italic; font-weight: 500; }
    .text-container p { font-size: 1.3rem; font-style: italic; margin-top: 5px; color: #aa5366; }
    .hint { font-size: 0.9rem !important; margin-top: 12px; opacity: 0.75; font-style: normal !important; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cake">
      <!-- กดที่ตัวเทียนเพื่อเป่าไฟให้ดับ -->
      <div class="candle" id="candle" onclick="blowOutCandle()">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>

      <!-- ครีมสีขาวทึบไร้รอยต่อ -->
      <div class="icing-wrapper">
        <svg class="icing-svg" viewBox="0 0 250 55" preserveAspectRatio="none">
          <path d="M 0,0 
                   L 250,0 
                   L 250,20 
                   Q 240,40 230,40 Q 220,40 210,20 
                   Q 200,50 188,50 Q 175,50 165,20 
                   Q 155,32 145,32 Q 135,32 125,20 
                   Q 115,45 102,45 Q 90,45 80,20 
                   Q 70,28 60,28 Q 50,28 40,20 
                   Q 30,52 18,52 Q 5,52 0,20 Z" />
        </svg>
      </div>

      <!-- ชั้นเค้ก 3 ชั้น -->
      <div class="layer layer-top"></div>
      <div class="layer layer-middle"></div>
      <div class="layer layer-bottom"></div>
    </div>

    <div class="plate"></div>

    <div class="text-container">
      <h1>happy birthday!</h1>
      <p style="color:white"> เด็กหญิงปริยาภัทร ขวัญชัย
</p>
<p style="color:white">(มโนราห์ข้าวทิพย์ ธิดาศิลป์)</p>
      <p class="hint">🕯️ กดที่เทียนเพื่อเป่าดับ</p>
    </div>
  </div>


  <script>
    function blowOutCandle() {
      const candle = document.getElementById('candle');
      if (!candle.classList.contains('blown-out')) {
        candle.classList.add('blown-out');

        // โปรยพลุกระดาษฉลอง
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      }
    }
  </script>

</body>
</html>
